name: acs-spec
version: 1
description: 移动端 AI Coding 工作流，支持动态知识注入

artifacts:
  # ============================================================================
  # 阶段 1: Proposal - 需求提案
  # ============================================================================
  - id: proposal
    generates: proposal.md
    description: 基于系分文档生成需求提案，明确变更意图、范围和影响
    template: proposal.md
    instruction: |
      ## 目标
      基于系分文档生成需求提案。

      ## 输入来源
      - 系分文档：从 config.yaml context 中读取
      - 知识文档：从 config.yaml context 中读取已匹配的知识

      ## 必须包含
      | 章节 | 说明 |
      |------|------|
      | 背景 | 需求背景和动机 |
      | 变更内容 | 具体变更内容 |
      | 技术方案 | 参考知识文档中的 Preferred Entry |
      | 影响范围 | 影响评估 |

      ## 知识参考
      **重要**：必须参考 config.yaml context 中的知识文档：
      - 使用知识文档中推荐的 API 和入口
      - 遵循知识文档中的 Avoid Native Or Raw Usage
      - 注意知识文档中的 Constraints

      ## 输出
      生成 proposal.md 到当前变更目录。

      ## 完成后的输出要求

      ```
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      ✅ Proposal 阶段完成
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      📄 本阶段作用
      创建提案文档，明确变更意图、范围和影响评估。

      📁 生成结果
      文件：openspec/changes/<change-name>/proposal.md

      💡 提示
      - 如需修改，直接告诉我需要调整的内容
      - 确认无误后，执行下一步

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      🎯 下一步：Spec（功能规范）
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      💻 执行命令
      openspec instructions spec --change "<change-name>" --json
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      ```

    requires: []

  # ============================================================================
  # 阶段 2: Spec - 功能规范
  # ============================================================================
  - id: spec
    generates: spec.md
    description: 定义功能规范，包含详细需求和验收场景
    template: spec.md
    instruction: |
      ## 目标
      定义功能规范，包含详细需求和验收场景。

      ## 格式要求
      - 每个需求：`### Requirement: <name>` 后跟描述
      - 每个场景：`#### Scenario: <name>` 使用 WHEN/THEN 格式
      - 每个需求至少有一个场景

      ## 变更操作类型

      | 类型 | 说明 |
      |------|------|
      | ADDED | 新增功能，完整需求描述 |
      | MODIFIED | 修改功能，包含完整更新内容 |
      | REMOVED | 删除功能，包含原因和迁移方案 |

      ## 知识参考
      参考 config.yaml context 中的知识文档，确保：
      - 技术方案符合知识推荐
      - 错误处理遵循知识规范

      ## 输出
      生成 spec.md 到当前变更目录。

      ## 完成后的输出要求

      ```
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      ✅ Spec 阶段完成
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      📄 本阶段作用
      定义功能规范，包含详细需求和验收场景，作为开发和测试的依据。

      📁 生成结果
      文件：openspec/changes/<change-name>/spec.md

      💡 提示
      - 如需修改，直接告诉我需要调整的内容
      - 确认无误后，执行下一步

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      🎯 下一步：Design（技术设计）
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      💻 执行命令
      openspec instructions design --change "<change-name>" --json
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      ```

    requires: [proposal]

  # ============================================================================
  # 阶段 3: Design + Tasks - 技术设计与任务拆解
  # ============================================================================
  - id: design
    generates: design.md
    description: 技术设计 + 任务拆解，生成设计文档和可执行任务清单
    template: design.md
    instruction: |
      ## 目标
      生成技术设计文档和任务清单。

      **注意**：本阶段只生成文档，不执行开发任务。实际开发在 Apply 阶段执行。

      ---

      ## 🔍 第一步：搜索现有代码（必须先执行！）

      **在编写任何设计文档之前，必须先搜索本地工程代码！**

      ```bash
      # 根据需求关键词搜索相关代码
      Grep: "<关键词>"（如：gift.*tray, GiftTray, 埋点, track）
      Glob: "**/*<关键词>*"（搜索文件名相关）
      ```

      找到关键文件后，读取内容提取：
      - 现有实现方式
      - 关键类/方法签名
      - 代码位置（精确的文件路径）

      **design.md 中必须包含“现有代码位置”章节！**

      ---

      ## 🧬 第二步：提取关联代码的编码模式

      在第一步搜索到关联代码后，进一步提取项目的编码模式，作为新代码的写作范式。

      ### 提取什么

      从搜索到的关联代码中识别以下模式：

      | 模式类型 | 提取内容 | 示例 |
      |----------|----------|------|
      | **命名规范** | 类名/方法名/变量名的命名风格 | 前缀约定、驼峰/下划线风格 |
      | **代码结构** | 相似功能的文件组织和类结构 | MVC/MVVM 分层、Manager/Service 模式 |
      | **API 调用模式** | 相似场景下调用框架 API 的方式 | 回调 vs async、参数传递方式 |
      | **错误处理模式** | 项目中统一的错误处理方式 | try-catch 风格、错误码定义 |
      | **日志/埋点模式** | 项目中日志和埋点的写法 | 日志格式、埋点调用链路 |

      ### 怎么提取

      1. **找同类代码**：搜索与当前需求同类型的已有实现（如：需要加埋点→找项目中已有的埋点代码）
      ```bash
      # 找同目录或同模块下的类似文件
      Glob: "<关联代码所在目录>/**"
      # 找同类功能的实现
      Grep: "<相似功能关键词>" --type <平台文件类型>
      ```

      2. **读取 2-3 个典型文件**：选择最相关的 2-3 个文件完整阅读，理解其编码模式

      3. **归纳模式规则**：总结出可复用的编码模式（不是复制代码，而是提炼规则）

      ### 输出要求

      design.md 中必须包含 **「编码模式参考」** 章节：

      ```markdown
      ## 编码模式参考

      **来源文件**：
      - `模块A/FileA.swift` - 同类功能实现
      - `模块B/FileB.swift` - 相似埋点实现

      **提取的模式**：
      - 命名：类名使用 `XXXManager` 后缀，方法名以动词开头
      - 结构：Controller 持有 Manager，Manager 封装业务逻辑
      - 埋点：统一通过 `Tracker.shared.track(.事件名)` 调用
      - 错误处理：使用 Result 类型，不直接 throw
      ```

      **关键**：如果知识文档已覆盖该场景，以知识文档为准；编码模式参考是知识文档的补充，不是替代。

      ---

      ## 设计文档要求
      | 章节 | 说明 |
      |------|------|
      | 背景 | 背景、当前状态、技术栈 |
      | 目标与非目标 | 明确做什么和不做什么 |
      | 技术方案 | 详细技术实现方案 |
      | 接口设计 | API/方法签名（按需） |
      | 代码位置 | 需要修改/新增的文件路径 |
      | 关键代码 | 核心代码片段 |

      ## 任务清单要求
      - 细粒度任务拆分
      - 每个任务可独立执行
      - 标注任务类型：开发/编译/测试
      - 使用 `- [ ]` 格式

      ## 知识参考
      **关键**：必须参考 config.yaml context 中的知识文档：
      - 使用知识文档中 Preferred Entry 指定的 API
      - 遵循 How To Use 中的使用步骤
      - 注意 Constraints 中的约束条件
      - 避免 Avoid Native Or Raw Usage 中列出的方式

      ## 技术方案查找（必须遵循）

      **必须主动查找**技术方案，**禁止**告诉用户"手动尝试"或"无法完成"。

      ### 查找优先级（按顺序）

      1. **本地工程代码（Grep/Glob 搜索已有实现）** ← 最优先！
         - 搜索与需求相关的现有代码文件
         - 找到关键业务代码位置（如：礼物托盘相关的 GiftTrayController）
         - 参考现有实现方式

      2. config.yaml context 中的知识文档
      3. Skill 文档（`.codefuse/skills/` 目录）
      4. 网络搜索（最后手段）

      ### 搜索策略

      根据需求关键词进行搜索：
      - 功能关键词：搜索相关模块/类的实现
      - 文件路径：优先查找与需求相关的目录
      - 类名/方法名：搜索现有类似实现

      **示例**：如果需求是"礼物托盘 SPM 埋点"
      ```bash
      # 搜索礼物托盘相关代码
      Grep: "gift.*tray|GiftTray" (iOS: *.swift, Android: *.kt)
      Grep: "SPM|埋点|track" 在相关目录

      # 找到关键文件后，读取实现参考
      Read: 已找到的 GiftTray 相关文件
      ```

      ### 输出要求

      design.md 中必须包含：
      - **现有代码位置**：找到的关键文件路径（必须准确）
      - **参考实现**：从现有代码中提取的关键片段

      ## 输出
      生成 design.md 和 tasks.md 到当前变更目录。

      ## 完成后的输出要求

      ```
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      ✅ Design 阶段完成
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      📄 本阶段作用
      生成技术设计文档和任务清单，为开发实施做准备。

      📁 生成结果
      | 文档 | 路径 |
      |------|------|
      | 技术设计 | openspec/changes/<change-name>/design.md |
      | 任务清单 | openspec/changes/<change-name>/tasks.md |

      💡 提示
      - 如需修改技术方案，告诉我具体调整内容
      - 如需调整任务，告诉我需要变更的任务项
      - 确认无误后，执行下一步

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      🎯 下一步：Apply（执行开发）
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      📄 下一阶段作用
      按照 tasks.md 任务清单执行开发任务，包括编码、编译、测试。

      💻 执行命令
      openspec instructions apply --change "<change-name>"
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      ```

    requires: [spec]

  # ============================================================================
  # Apply 阶段 - 执行开发任务
  # ============================================================================
apply:
  requires: [design]
  tracks: tasks.md
  instruction: |
    ## 目标
    按 tasks.md 执行开发任务。

    ## 执行原则

    1. **按顺序执行任务**，不能跳过
    2. **参考 config.yaml context 中的知识文档**
    3. **使用知识推荐的方式实现**
    4. **完成后验证通过**

    ## 知识参考

    编码时参考 config.yaml context 中的知识文档：
    - API 调用方式参考 Preferred Entry
    - 避免使用 Avoid Native Or Raw Usage 中列出的方式
    - 遵循 Constraints 中的约束条件
    - 按照 How To Use 中的步骤实现

    ## 编码时的模仿策略

    **每个开发任务开始前**，必须执行以下动作：

    1. **检查 design.md 中的「编码模式参考」章节**，了解项目编码格式
    2. **如果当前任务涉及新场景**（design.md 中未覆盖），主动搜索关联代码：
       - 在同模块/同目录下找同类型文件
       - 阅读其实现方式，提取编码模式
       - 按照提取的模式编写新代码
    3. **模仿的优先级**：
       - 知识文档 > 同模块关联代码 > 同项目其他模块代码 > AI 默认能力

    ### 模仿什么

    | 维度 | 说明 |
    |------|------|
    | 文件结构 | 新文件的目录位置和文件命名参考同类文件 |
    | import 顺序 | 参考同目录文件的 import 组织方式 |
    | 类/方法结构 | 参考同类文件的代码组织（属性声明顺序、方法分组） |
    | 调用模式 | 调用框架 API 的方式与关联代码保持一致 |
    | 注释风格 | 注释格式和密度与同目录文件保持一致 |

    ### 不模仿什么

    - 明显的技术债务或已废弃的写法（有 deprecated 标记的）
    - 知识文档中明确标注 Avoid 的模式
    - 与当前需求无关的业务逻辑

    ## 遇到问题时的正确做法

    **必须主动查找解决方案**，禁止告诉用户"无法完成"或"需要手动处理"。

    按以下优先级查找：
    1. **本地工程已有实现（Grep/Glob 搜索）** ← 最优先！
       - 搜索与当前任务相关的现有代码
       - 参考现有实现方式
    2. config.yaml context 中的知识文档
    3. Skill 文档
    4. 网络搜索（最后手段）
    5. 询问用户（仅当前面都失败时）

    ## 任务执行约束

    - **所有任务必须执行完成**，不能中途放弃
    - **遇到错误必须解决**，通过查找、询问、调试等方式
    - **编译失败必须修复**，不能跳过
    - **只有用户明确要求**才能跳过某个任务

    ## 禁止事项

    - 禁止告诉用户"需要手动执行"或"无法完成"
    - 禁止跳过任何任务
    - 禁止输出"后续任务（需要手动执行）"
