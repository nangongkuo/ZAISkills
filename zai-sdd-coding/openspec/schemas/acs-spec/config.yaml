# ACS Spec Schema 配置
#
# 此文件是模板文件，由 lib/generate-config.js 动态生成实际配置
# 生成时会注入：项目信息、知识文档、系分文档
#
# OpenSpec 设计哲学：
# - context：提供项目背景和知识文档（动态注入）
# - rules：提供阶段性的约束规则
# - template：提供文档结构
# - instruction：提供操作指导
#
# 核心原则：知识优先级 - 仓库知识 > 通用知识 > 默认行为

# =============================================================================
# Schema 声明
# =============================================================================
schema: acs-spec

# =============================================================================
# 上下文 - 动态注入（由 generate-config.js 生成时填充）
# =============================================================================
# 生成后的格式示例：
#
# context: |
#   ## 项目信息
#   仓库路径: /path/to/repo
#   平台类型: iOS
#
#   ## 系分文档
#   {系分文档完整内容}
#
#   ## 知识文档（已按需加载完整内容）
#
#   ### ios-logging-tracking
#   {知识文档完整内容}
#
#   ---
#
#   ### ios-coding-standards
#   {知识文档完整内容}
#
#   ---
#
#   ## 知识优先级
#   仓库知识文档 > 通用知识文档 > 默认行为

context: |
  ## 项目信息
  仓库路径: {{repo_path}}
  平台类型: {{platform}}

  ## 系分文档
  {{yuque_doc_content}}

  ## 知识文档（已按需加载完整内容）
  {{knowledge_content}}

  ## 知识优先级
  仓库知识文档 > 通用知识文档 > 默认行为

# =============================================================================
# 规则 - 阶段性约束（短句声明式，只说要求不说怎么做）
# =============================================================================
rules:
  proposal:
    - 聚焦“为什么”和“做什么”，不涉及“怎么做”
    - 保持简洁（1-2 页）
    - 实现细节属于 design.md
    - 必须参考知识文档中的 Preferred Entry
    - 避免使用知识文档中 Avoid Native Or Raw Usage 列出的方式
    - 注意知识文档中的 Constraints

  spec:
    - 使用 ADDED/MODIFIED/REMOVED 格式
    - 每个需求 MUST 至少包含一个场景（`#### Scenario`，4 级标题）
    - 使用 SHALL/MUST 表达规范性要求
    - 技术方案必须符合知识文档推荐

  design:
    - 优先使用知识文档推荐的 API 和入口
    - 代码位置必须准确（文件路径）
    - 关键代码片段必须完整
    - 遵循知识文档中的 How To Use 步骤
    - 注意知识文档中的 Constraints
    - 搜索关联代码后必须提取编码模式，写入 design.md「编码模式参考」章节
    - 编码模式参考至少包含：命名规范、代码结构、API 调用模式
    - 优先级：知识文档 > 关联代码模仿 > AI 默认能力
    - 禁止返回任务耗时预估

  apply:
    - 遵循知识文档中的编码规范
    - 使用知识文档推荐的实现方式
    - 每个任务开始前检查 design.md「编码模式参考」，按项目现有模式编写新代码
    - 新场景未被知识文档覆盖时，必须搜索同模块关联代码并模仿其写法
    - 新文件的目录位置、命名、结构必须与同类文件保持一致
    - 禁止告诉用户“需要手动执行”或“无法完成”
    - 禁止跳过任何任务
    - 禁止输出“后续任务（需要手动执行）”
